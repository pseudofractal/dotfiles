<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="160mm"
     height="100mm"
     viewBox="0 0 160 100">
  <title>Scientific Illustration — Rectangle</title>
  <desc>160 mm by 100 mm starter canvas with a 0.5 mm grid, grid snapping, and a 0.5 pt stroke-style reference. Change page width and height in Document Properties for a custom size.</desc>
  <inkscape:_templateinfo>
    <inkscape:_name>Scientific Illustration - Rectangle</inkscape:_name>
    <inkscape:label>160 × 100 mm</inkscape:label>
    <inkscape:_shortdesc>Rectangular starter canvas for scientific figures and diagrams.</inkscape:_shortdesc>
    <inkscape:_keywords>scientific illustration diagram figure vector rectangle</inkscape:_keywords>
    <inkscape:category>Custom</inkscape:category>
  </inkscape:_templateinfo>
  <sodipodi:namedview id="namedview"
      pagecolor="#1e1e2e"
      bordercolor="#666666"
      borderopacity="1"
      inkscape:pageopacity="1.0"
      inkscape:pageshadow="2"
      inkscape:zoom="1.4142136"
      inkscape:cx="302.3622"
      inkscape:cy="188.97638"
      inkscape:document-units="mm"
      inkscape:current-layer="illustration"
      showgrid="true"
      inkscape:snap-global="true"
      inkscape:snap-grids="true"
      inkscape:snap-to-guides="false"
      inkscape:snap-nodes="true"
      inkscape:window-maximized="1">
    <inkscape:grid id="grid"
        type="xygrid"
        units="mm"
        originx="0"
        originy="0"
        spacingx="0.5"
        spacingy="0.5"
        empspacing="10"
        color="#718096"
        opacity="0.18"
        empcolor="#718096"
        empopacity="0.42"
        visible="true"
        enabled="true"
        snapvisiblegridlinesonly="false" />
  </sodipodi:namedview>
  <g id="illustration"
     inkscape:groupmode="layer"
     inkscape:label="Illustration"
     style="stroke:#cdd6f4;stroke-width:0.1764;stroke-linecap:butt;stroke-linejoin:round" />
  <g id="stroke-style-reference"
     inkscape:groupmode="layer"
     inkscape:label="Stroke style reference (show to copy 0.5 pt)"
     style="display:none">
    <path id="stroke-style-sample"
        d="M 10,10 H 40"
        style="fill:none;stroke:#cdd6f4;stroke-width:0.1764;stroke-linecap:butt;stroke-linejoin:round" />
  </g>
</svg>
